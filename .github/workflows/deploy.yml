name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 只保留最后一次部署，不取消进行中的
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lastUpdated 需要完整历史

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 分享卡片（docs/.vitepress/og.ts）构建时用系统字体渲染中文，runner 默认没有中文字体。
      # 装完再确认一遍：没有中文字体就直接失败，免得上线一批中文全是方块的卡片。
      # 软件源偶尔会卡死（平时 1 分钟内装完），5 分钟没装完就判失败，到 Actions 页面重跑即可，
      # 不然要等 GitHub 默认的 6 小时才超时。
      - name: Install CJK fonts for share cards
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
          sudo apt-get install -y -qq --no-install-recommends fonts-jetbrains-mono || echo "JetBrains Mono 装不上，等宽字回退到 DejaVu Sans Mono"
          fc-list :lang=zh family | grep -q . || { echo "没有可用的中文字体"; exit 1; }

      - run: npm run docs:build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
